<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Rahul Pranasseri</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  (function () { var t = 'dark'; try { t = localStorage.getItem('rp-theme') || 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#101317; --surface:#171B21; --text:#E9ECEF; --text-2:#A3ADB9; --edge:#3A434F;
    --accent:#F5782F; --accent-hover:#FF8C4A; --accent-text:#FF9A5C; --on-accent:#1A0E05;
    --grid-major:rgba(245,120,47,.22); --grid-minor:rgba(233,236,239,.05);
    --gutter:clamp(16px, 4vw, 48px);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#E9EBEE; --surface:#F6F7F8; --text:#1C2127; --text-2:#4A525C; --edge:#1C2127;
    --accent:#F06A1F; --accent-hover:#FF7D33; --accent-text:#A9440C;
    --grid-major:rgba(240,106,31,.32); --grid-minor:rgba(28,33,39,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{min-height:100%;}
  body{min-height:100vh; display:grid; place-items:center; background-color:var(--bg); color:var(--text);
    font-family:"Archivo", system-ui, sans-serif; line-height:1.6; padding:48px var(--gutter);
    background-image:linear-gradient(var(--grid-major) 2px, transparent 2px), linear-gradient(90deg, var(--grid-major) 2px, transparent 2px),
      linear-gradient(var(--grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size:200px 200px, 200px 200px, 25px 25px, 25px 25px;}
  main{max-width:620px; background:var(--surface); border:2px solid var(--edge); padding:40px clamp(22px, 5vw, 48px); box-shadow:10px 10px 0 rgba(0,0,0,.35);}
  .code{font-family:"JetBrains Mono", ui-monospace, Consolas, monospace; font-size:14px; color:var(--accent-text);}
  h1{font-variation-settings:"wdth" 125; font-weight:850; font-size:clamp(34px, 6vw, 56px); line-height:1; letter-spacing:-0.02em; margin:12px 0 16px;}
  p{color:var(--text-2); font-size:17px;}
  .actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px;}
  a.btn{display:inline-flex; padding:11px 18px; font-weight:650; text-decoration:none; border:2px solid var(--text); color:var(--text);}
  a.btn:hover{background:var(--text); color:var(--bg);}
  a.btn-dev{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  a.btn-dev:hover{background:var(--accent-hover); border-color:var(--accent-hover); color:var(--on-accent);}
  a:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
</style>
</head>
<body>
<main>
  <p class="code">404 · Out of bounds</p>
  <h1>You walked off the edge of the map</h1>
  <p>This page doesn't exist. It may have moved when the portfolio was rebuilt. Head back to the start and you'll find every project from there.</p>
  <div class="actions">
    <a class="btn btn-dev" href="/">Back to the portfolio</a>
    <a class="btn" href="/#work">See my work</a>
  </div>
</main>
</body>
</html>
